<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mangás · Stremio Community</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
</head>
<body>
    <div id="ambient-art" aria-hidden="true"></div>
    <header>
        <button id="home" type="button">← Filmes e séries</button>
        <strong>Mangás</strong>
        <nav aria-label="Leitor">
            <button id="manga-home" type="button">Home</button>
            <button id="library" type="button">Biblioteca</button>
            <button id="recommendations" type="button">Recomendados</button>
            <button id="catalog" type="button">Buscar</button>
            <button id="sources" type="button">Fontes</button>
        </nav>
        <button id="toggle-fullscreen" type="button" class="fullscreen-toggle" aria-label="Entrar em tela cheia" aria-pressed="false" title="Entrar em tela cheia">
            <svg class="fullscreen-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3"/></svg>
            <svg class="fullscreen-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/></svg>
        </button>
        <button id="header-hide" type="button" class="header-collapse-toggle" aria-label="Recolher barra superior" title="Recolher barra superior" aria-expanded="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
        </button>
    </header>
    <button id="header-show" type="button" class="header-reveal" aria-label="Mostrar barra superior" title="Mostrar barra superior" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <main id="view"></main>
</body>
</html>
