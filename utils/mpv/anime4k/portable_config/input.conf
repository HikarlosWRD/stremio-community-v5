# The native menu uses the same presets as these shortcuts.
CTRL+1 script-message-to upscale_preview preset anime_a
CTRL+2 script-message-to upscale_preview preset anime_b
CTRL+3 script-message-to upscale_preview preset anime_c
CTRL+4 script-message-to upscale_preview preset anime_aa
CTRL+5 script-message-to upscale_preview preset anime_bb
CTRL+6 script-message-to upscale_preview preset anime_ca
CTRL+7 script-message-to upscale_preview preset fsr
CTRL+0 script-message-to upscale_preview preset off

# Audio normalization and subtitle override from upstream.
F1 af toggle "lavfi=[loudnorm=I=-22:TP=-1.5:LRA=2]" ; show-text "Audio Normalization is now: ${af}"
F2 cycle-values sub-ass-override "force" "strip" "no"; show-text "sub-ass-override=${sub-ass-override}"
